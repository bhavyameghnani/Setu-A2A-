[project]
name = "setu-sdk"
version = "0.1.0"
description = "Python SDK for Setu: join rooms, run agents, wrap LangGraph, serve agents over A2A"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "websockets>=13",
]

[project.optional-dependencies]
# Neither extra is needed for the client or the Agent base class.
langgraph = ["langgraph>=0.2"]
serve = ["a2a-sdk[fastapi]>=1.3.0", "uvicorn>=0.30"]
verify = ["pyjwt[crypto]>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["setu_sdk"]
