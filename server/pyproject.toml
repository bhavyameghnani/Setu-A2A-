[project]
name = "setu-server"
version = "0.0.0"
description = "Setu: governed A2A hub for cross-department agent collaboration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "argon2-cffi>=25.1.0",
  "pyjwt>=2.15.1",
  "httpx>=0.28.1",
  "cryptography>=50.0.2",
  "a2a-sdk[fastapi]>=1.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "langgraph>=1.2.20",
  "websockets>=17.4",
  "setu-sdk",
  "playwright>=1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = ["e2e: drives the web app in a real browser (needs Playwright's Chromium and Node)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "UP", "I"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.a2a.*"]
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

[tool.uv.sources]
setu-sdk = { path = "../sdk/python", editable = true }
